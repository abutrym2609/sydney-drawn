<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Sydney, drawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#262522;
    --graphite:#6E6C66;
    --rule:#DCD9D0;
    --thread:#D2342A;
    --hover:#F1EFE7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
  body{min-height:100vh}

  .page{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  @media (max-width:860px){.page{grid-template-columns:1fr}}

  /* index column */
  .index{border-right:1px solid var(--rule);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  @media (max-width:860px){.index{height:auto;position:static;border-right:0;border-bottom:1px solid var(--rule)}}
  .masthead{padding:28px 24px 18px}
  .masthead h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
  .masthead p{margin:0;color:var(--graphite);font-size:14px;max-width:22ch}
  .search{margin:0 24px 8px;position:relative}
  .search input{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search input::placeholder{color:var(--graphite)}
  .search input:focus-visible{border-bottom-width:2px}
  .list{overflow:auto;padding:6px 0 24px;flex:1;scrollbar-width:thin}
  @media (max-width:860px){.list{max-height:34vh}}
  .region{padding:14px 24px 4px;color:var(--graphite);font-size:12.5px;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:15px}
  .list button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:5px 24px;cursor:pointer;border-radius:0}
  .list button:hover{background:var(--hover)}
  .list button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .list button.on{background:var(--ink);color:var(--paper)}
  .list button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--thread);margin-left:8px;vertical-align:middle;opacity:0}
  .list button.has-art .dot{opacity:1}
  .empty{padding:18px 24px;color:var(--graphite)}

  /* studio */
  .studio{padding:36px 40px 48px;display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:860px){.studio{padding:20px 16px 32px}}
  .sheet{position:relative;width:100%;aspect-ratio:1939/811;background:var(--paper)}
  .sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .prompt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;transition:opacity .4s}
  .prompt.hide{opacity:0}
  .prompt span{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(22px,3.4vw,44px);color:var(--graphite);max-width:20ch;line-height:1.1}

  /* red thread progress */
  .thread{height:14px;width:100%}
  .thread svg{width:100%;height:14px;display:block;overflow:visible}
  .thread .stitch{stroke:var(--thread);stroke-width:2;fill:none;stroke-dasharray:11 7;stroke-linecap:round}
  .thread .knot{fill:var(--thread);opacity:0;transition:opacity .3s}

  .foot{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;justify-content:space-between;color:var(--graphite);font-size:14px;min-height:22px}
  .foot .stage{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:17px;color:var(--ink)}
  .foot .stage:empty{display:none}
  .actions{display:flex;gap:18px}
  .actions button{border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule)}
  .actions button:hover{text-decoration-color:var(--ink)}
  .actions button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .actions[hidden]{display:none}
  .note{color:var(--graphite);font-size:13px}

  @media (prefers-reduced-motion:reduce){.prompt{transition:none}}
</style>
</head>
<body>
<div class="page">
  <aside class="index">
    <div class="masthead">
      <h1>Greater Sydney,<br>drawn.</h1>
      <p>Pick a suburb and watch its portrait appear, line by line.</p>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Find a suburb" autocomplete="off" aria-label="Find a suburb"></div>
    <nav class="list" id="list" aria-label="Suburbs"></nav>
  </aside>

  <main class="studio">
    <div class="sheet" id="sheet">
      <canvas id="cv" aria-label="Suburb illustration"></canvas>
      <div class="prompt" id="prompt"><span>Choose a suburb from the index.</span></div>
    </div>
    <div class="thread" aria-hidden="true">
      <svg viewBox="0 0 1000 14" preserveAspectRatio="none">
        <path id="stitch" class="stitch" d="M0 7 L0 7"/>
        <circle id="knot" class="knot" cx="0" cy="7" r="3.5"/>
      </svg>
    </div>
    <div class="foot">
      <div class="stage" id="stage" aria-live="polite"></div>
      <div class="actions" id="actions" hidden>
        <button id="again">Draw it again</button>
        <button id="save">Save as PNG</button>
      </div>
      <div class="note" id="note"></div>
    </div>
  </main>
</div>

/* ---------- index ---------- */
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
let current = null;

function renderList(filter=""){
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  let count = 0;
  for (const [region, subs] of Object.entries(REGIONS)){
    const hits = subs.filter(s => s.toLowerCase().includes(f));
    if (!hits.length) continue;
    const h = document.createElement('div'); h.className='region'; h.textContent=region; listEl.appendChild(h);
    for (const s of hits){
      const b = document.createElement('button');
      b.type='button'; b.textContent=s; b.dataset.suburb=s;
      if (ART[s]) b.classList.add('has-art');
      if (s===current) b.classList.add('on');
      const d=document.createElement('span'); d.className='dot'; b.appendChild(d);
      b.addEventListener('click', ()=>choose(s));
      listEl.appendChild(b); count++;
    }
  }
  if (!count){ const e=document.createElement('div'); e.className='empty'; e.textContent=`No suburb called “${filter}”. Try another spelling.`; listEl.appendChild(e); }
}
qEl.addEventListener('input', e=>renderList(e.target.value));
renderList();

/* ---------- drawing engine ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const sheet = document.getElementById('sheet');
const promptEl = document.getElementById('prompt');
const stageEl = document.getElementById('stage');
const actionsEl = document.getElementById('actions');
const noteEl = document.getElementById('note');
const stitch = document.getElementById('stitch');
const knot = document.getElementById('knot');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0, raf=0, job=0;

function setSize(){
  const r = sheet.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  W = Math.round(r.width*dpr); H = Math.round(r.height*dpr);
  cv.width=W; cv.height=H;
}

function loadImage(src){
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
}
function offscreen(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

/* value noise, 2 octaves, returns Float32Array in [0,1] */
function noiseField(w,h,cells,seed){
  let s=seed>>>0; const rnd=()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return (s>>>0)/4294967296; };
  const gw=cells+2, gh=Math.ceil(cells*h/w)+2;
  const g=new Float32Array(gw*gh); for(let i=0;i<g.length;i++) g[i]=rnd();
  const out=new Float32Array(w*h);
  const sm=t=>t*t*(3-2*t);
  for(let y=0;y<h;y++){ const fy=y/h*(gh-1); const y0=fy|0, ty=sm(fy-y0);
    for(let x=0;x<w;x++){ const fx=x/w*(gw-1); const x0=fx|0, tx=sm(fx-x0);
      const a=g[y0*gw+x0], b=g[y0*gw+x0+1], c=g[(y0+1)*gw+x0], d=g[(y0+1)*gw+x0+1];
      out[y*w+x]=(a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty; } }
  return out;
}
function combine(w,h,parts){ // parts: [{field, weight}] + optional fn(x,y) base
  const out=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ let v=0; const i=y*w+x;
    for(const p of parts) v+= p.fn ? p.fn(x/w,y/h)*p.weight : p.field[i]*p.weight;
    out[i]=v; }
  // normalise to 0..1
  let mn=1e9,mx=-1e9; for(const v of out){ if(v<mn)mn=v; if(v>mx)mx=v; }
  for(let i=0;i<out.length;i++) out[i]=(out[i]-mn)/(mx-mn);
  return out;
}

function buildLayers(img){
  const base=offscreen(W,H); const b=base.getContext('2d');
  b.fillStyle='#FFFFFF'; b.fillRect(0,0,W,H);
  // fit image into sheet, respecting aspect
  const s=Math.min(W/img.width,H*0.82/img.height); const iw=img.width*s, ih=img.height*s;
  b.drawImage(img,(W-iw)/2,(H*0.82-ih)/2,iw,ih);
  const fit={ox:(W-iw)/2,oy:(H*0.82-ih)/2,iw,ih};
  const src=b.getImageData(0,0,W,H).data;

  // luminance
  const lum=new Float32Array(W*H);
  for(let i=0;i<W*H;i++) lum[i]=(0.299*src[i*4]+0.587*src[i*4+1]+0.114*src[i*4+2]);

  // sobel edges -> linework layer
  const line=offscreen(W,H); const lc=line.getContext('2d');
  const ld=lc.createImageData(W,H); const L=ld.data;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-lum[i-W-1]-2*lum[i-1]-lum[i+W-1]+lum[i-W+1]+2*lum[i+1]+lum[i+W+1];
    const gy=-lum[i-W-1]-2*lum[i-W]-lum[i-W+1]+lum[i+W-1]+2*lum[i+W]+lum[i+W+1];
    let m=Math.sqrt(gx*gx+gy*gy)/4; // 0..~255
    let a=Math.min(255, m*1.6);
    if (a<18) a=0;
    L[i*4]=38; L[i*4+1]=37; L[i*4+2]=34; L[i*4+3]=a;
  }
  lc.putImageData(ld,0,0);

  // rough sketch layer: only the big shapes, computed at half size on blurred tone → soft, thicker, lighter lines
  const hw=W>>1, hh=H>>1; const lo=new Float32Array(hw*hh);
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){ const i=(y*2)*W+x*2; lo[y*hw+x]=(lum[i]+lum[i+1]+lum[i+W]+lum[i+W+1])/4; }
  const bl=new Float32Array(hw*hh); const R=2;
  for(let pass=0;pass<2;pass++){ const src2=pass?bl:lo, dst=pass?lo:bl;
    for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){ let s=0,n=0; for(let k=-R;k<=R;k++){ const xx=x+k; if(xx>=0&&xx<hw){s+=src2[y*hw+xx];n++;} } dst[y*hw+x]=s/n; }
    for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){ let s=0,n=0; for(let k=-R;k<=R;k++){ const yy=y+k; if(yy>=0&&yy<hh){s+=dst[yy*hw+x];n++;} } src2[y*hw+x]=s/n; }
  }
  const sk=offscreen(hw,hh); const skc=sk.getContext('2d'); const kd=skc.createImageData(hw,hh); const K=kd.data;
  for(let y=1;y<hh-1;y++)for(let x=1;x<hw-1;x++){ const i=y*hw+x;
    const gx=-lo[i-hw-1]-2*lo[i-1]-lo[i+hw-1]+lo[i-hw+1]+2*lo[i+1]+lo[i+hw+1];
    const gy=-lo[i-hw-1]-2*lo[i-hw]-lo[i-hw+1]+lo[i+hw-1]+2*lo[i+hw]+lo[i+hw+1];
    let a=Math.sqrt(gx*gx+gy*gy)/4*2.4; if(a<45) a=0; K[i*4]=96;K[i*4+1]=94;K[i*4+2]=90;K[i*4+3]=Math.min(190,a); }
  skc.putImageData(kd,0,0);
  const sketch=offscreen(W,H); const skx=sketch.getContext('2d'); skx.imageSmoothingEnabled=true; skx.drawImage(sk,0,0,W,H);

  // graphite shading layer (tonal, no colour)
  const shade=offscreen(W,H); const sc=shade.getContext('2d');
  const sd=sc.createImageData(W,H); const S=sd.data;
  for(let i=0;i<W*H;i++){ const v=lum[i]; const a=Math.max(0,(215-v))*1.05; // darker = more graphite
    S[i*4]=52; S[i*4+1]=50; S[i*4+2]=46; S[i*4+3]=Math.min(210,a); }
  sc.putImageData(sd,0,0);

  return {base, line, shade, sketch, fit};
}

/* mask at half res */
function makeMasks(px){
  const mw=Math.ceil(W/2), mh=Math.ceil(H/2);
  // which marker does this pixel need? order the pens: beige → yellow/ochre → red → green → blue/teal → brown → grey/black
  const pen=new Float32Array(mw*mh);
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){ const i=((y*2)*W+x*2)*4; const r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn; const s=d===0?0:d/(1-Math.abs(2*l-1));
    let hue=0; if(d){ if(mx===r)hue=((g-b)/d+6)%6; else if(mx===g)hue=(b-r)/d+2; else hue=(r-g)/d+4; hue*=60; }
    let k;
    if(l>0.82&&s<0.5) k=0;                       // paper-light beige
    else if(s<0.16) k=6;                          // greys & black
    else if(hue>=35&&hue<70) k=1;                 // yellow / ochre
    else if(hue<20||hue>=330) k=2;                // red
    else if(hue>=70&&hue<170) k=3;                // green
    else if(hue>=170&&hue<270) k=4;               // blue / teal
    else k=5;                                     // browns & the rest
    pen[y*mw+x]=k/6; }
  const n1=noiseField(mw,mh,9,1234), n2=noiseField(mw,mh,26,777), n3=noiseField(mw,mh,5,42), n4=noiseField(mw,mh,14,99);
  return {
    mw,mh,
    // rough sketch: big loose patches across the whole sheet at once
    sketch: combine(mw,mh,[{field:n3,weight:0.6},{field:n1,weight:0.3},{fn:(x,y)=>Math.hypot(x-0.5,(y-0.5)*0.6),weight:0.1}]),
    // details: fine lines pop up around the composition, roughly centre-out
    line: combine(mw,mh,[{field:n1,weight:0.4},{field:n2,weight:0.25},{fn:(x,y)=>Math.hypot(x-0.5,(y-0.5)*0.6)*1.2,weight:0.35}]),
    // colour: one marker at a time (pen order), patchy within each pen
    colour: combine(mw,mh,[{field:pen,weight:0.86},{field:n4,weight:0.09},{field:n2,weight:0.05}])
  };
}

const PHASES = [ // seconds
  {key:'sketch',  dur:6,   label:'Rough sketch'},
  {key:'gag',     dur:6,   label:'Hmm… no.'},
  {key:'line',    dur:8.5, label:'Fineliner details'},
  {key:'marker',  dur:18,  label:'Markers, one pen at a time'}
];
const TOTAL = PHASES.reduce((a,p)=>a+p.dur,0);

async function choose(name){
  current=name; renderList(qEl.value);
  const src = ART[name] || ART[DEMO];
  noteEl.textContent = ART[name] ? "" : `The ${name} illustration hasn't been painted yet — this is the ${DEMO} artwork as a demo.`;
  if (innerWidth<=860) sheet.scrollIntoView({behavior: reduced?'auto':'smooth', block:'start'});
  await draw(name, src);
}

async function draw(name, src){
  const myJob=++job; cancelAnimationFrame(raf);
  actionsEl.hidden=true; knot.style.opacity=0; setStitch(0);
  promptEl.classList.add('hide'); stageEl.textContent='';
  setSize();
  await document.fonts.ready.catch(()=>{});
  const img = await loadImage(src);
  if (myJob!==job) return;
  const layers = buildLayers(img);
  const px = layers.base.getContext('2d').getImageData(0,0,W,H).data;
  const masks = makeMasks(px);

  /* the wrong doodle, on the margin next to the drawing */
  const g = GAG[name] || (ART[name]?null:GAG[DEMO]);
  const gag=offscreen(W,H); const gc=gag.getContext('2d'); gc.lineCap='round'; gc.lineJoin='round'; gc.filter=`blur(${1.6*W/1000}px)`;
  let doodle=null;
  if(g&&DOODLES[g.wrong]){ const {ox,oy,iw,ih}=layers.fit; const size=(g.size||GAG_SIZE)*iw, pad=size/2+6; const cx=Math.min(W-pad,Math.max(pad,ox+g.x*iw)), cy=Math.min(H-pad,Math.max(pad,oy+g.y*ih));
    const wob=(i)=>Math.sin(i*12.9898)*0.012;
    const polys=DOODLES[g.wrong].map((pl,k)=>pl.map(([x,y],i)=>[cx-size/2+(x+wob(i+k*7))*size, cy-size/2+(y+wob(i*3+k))*size]));
    const segs=[]; let total=0; polys.forEach(pl=>{ for(let i=1;i<pl.length;i++){ const L=Math.hypot(pl[i][0]-pl[i-1][0],pl[i][1]-pl[i-1][1]); segs.push({a:pl[i-1],b:pl[i],L,from:total}); total+=L; } });
    doodle={segs,total,cx,cy,size};
  }
  let drawnTo=0; const crumbs=[];
  function drawDoodleTo(len){
    gc.strokeStyle='rgb(96,94,90)'; gc.lineWidth=4*S; gc.globalAlpha=0.42;   // same pencil as the rough sketch
    for(const s of doodle.segs){ if(s.from+s.L<=drawnTo||s.from>=len) continue;
      const t0=Math.max(0,(drawnTo-s.from)/s.L), t1=Math.min(1,(len-s.from)/s.L);
      gc.beginPath(); gc.moveTo(s.a[0]+(s.b[0]-s.a[0])*t0, s.a[1]+(s.b[1]-s.a[1])*t0); gc.lineTo(s.a[0]+(s.b[0]-s.a[0])*t1, s.a[1]+(s.b[1]-s.a[1])*t1); gc.stroke();
      cursor.x=s.a[0]+(s.b[0]-s.a[0])*t1; cursor.y=s.a[1]+(s.b[1]-s.a[1])*t1; cursor.tx=cursor.x; cursor.ty=cursor.y; }
    drawnTo=len;
  }
  function erase(q){
    const d=doodle; const sweeps=4; const k=q*sweeps; const row=Math.min(sweeps-1,Math.floor(k)); const u=k-row; const dir=row%2?1-u:u;
    const x=d.cx-d.size*0.6+dir*d.size*1.2, y=d.cy-d.size*0.5+(row+0.5)/sweeps*d.size;
    gc.globalCompositeOperation='destination-out'; gc.globalAlpha=1; gc.lineWidth=d.size/sweeps*1.15; gc.lineCap='round';
    gc.beginPath(); gc.moveTo(cursor.x,cursor.y); gc.lineTo(x,y); gc.stroke(); gc.globalCompositeOperation='source-over';
    cursor.x=x; cursor.y=y; cursor.tx=x; cursor.ty=y;
    if(Math.random()<0.7) crumbs.push({x:x+(Math.random()-0.5)*d.size*0.4, y:y+(Math.random()-0.5)*d.size*0.15, vy:0.4*S+Math.random()*S, r:(0.8+Math.random()*1.4)*S, a:0.8});
  }
  function drawCrumbs(){ for(const c of crumbs){ c.y+=c.vy; c.vy+=0.12*S; c.a-=0.018; if(c.a<=0) continue; ctx.globalAlpha=c.a; ctx.fillStyle='#8a8580'; ctx.beginPath(); ctx.ellipse(c.x,c.y,c.r*1.6,c.r,0.6,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; while(crumbs.length&&crumbs[0].a<=0) crumbs.shift(); }

  if (reduced){ ctx.drawImage(layers.base,0,0); finish(); return; }

  const layer=offscreen(W,H); const lc=layer.getContext('2d');          // the layer currently being masked in
  const maskC=offscreen(masks.mw,masks.mh); const mc=maskC.getContext('2d');
  const mid=mc.createImageData(masks.mw,masks.mh);
  const inkMask=offscreen(W,H); const im=inkMask.getContext('2d'); im.lineCap='round'; im.strokeStyle='#fff';  // where marker has touched
  const colour=offscreen(W,H); const cc=colour.getContext('2d');       // the artwork, revealed through inkMask
  const angleField=noiseField(masks.mw,masks.mh,7,2024);
  const S=W/1000;

  const cursor={x:W*0.05,y:H*0.5,tx:W*0.05,ty:H*0.5};
  let tip='rgb(60,60,60)';
  let start=performance.now(), phaseIdx=0, phaseStart=start;

  function maskTo(field,t){
    const D=mid.data; const soft=0.07;
    for(let i=0;i<field.length;i++){ let a=(t*(1+soft)-field[i])/soft; a=a<0?0:a>1?1:a; D[i*4+3]=a*255|0; D[i*4]=D[i*4+1]=D[i*4+2]=0; }
    mc.putImageData(mid,0,0);
  }
  function frontier(field,t){
    let best=null,bd=1e12;
    for(let k=0;k<160;k++){ const i=(Math.random()*field.length)|0; const d=field[i]-t;
      if(d>-0.03&&d<0.015){ const x=(i%masks.mw)*2,y=(i/masks.mw|0)*2; const dd=(x-cursor.x)**2+(y-cursor.y)**2+Math.random()*40000;
        if(dd<bd){bd=dd;best={x,y};} } }
    if(best){cursor.tx=best.x;cursor.ty=best.y;}
    cursor.x+=(cursor.tx-cursor.x)*0.28; cursor.y+=(cursor.ty-cursor.y)*0.28;
  }
  const lumAt=(x,y)=>{ if(x<0||y<0||x>=W||y>=H) return 255; const i=((y|0)*W+(x|0))*4; return 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; };

  /* one marker stroke: a broad flat swipe that reveals the artwork underneath it.
     First pass leaves the ink slightly translucent; overlapping passes bring it to full — like layering marker. */
  function markerStroke(x,y,late){
    if(x<0||y<0||x>=W-1||y>=H-1) return false;
    const lum=lumAt(x,y); if(lum>244) return false;
    const mi=((y/2)|0)*masks.mw+((x/2)|0);
    const base=-0.55+(angleField[mi]-0.5)*1.4;
    const ang=Math.random()<0.3 ? base+1.5 : base;
    const len=(16+Math.random()*30)*S*(late?1.5:1);
    const dx=Math.cos(ang)*len/2, dy=Math.sin(ang)*len/2;
    if(!late && (lumAt(x-dx,y-dy)>246||lumAt(x+dx,y+dy)>246)) return false;
    im.globalAlpha = late ? 1 : 0.62+Math.random()*0.25;
    im.lineWidth=(7+Math.random()*7)*S;
    const bow=(Math.random()-0.5)*len*0.1;
    im.beginPath(); im.moveTo(x-dx,y-dy); im.quadraticCurveTo(x+bow*Math.sin(ang),y-bow*Math.cos(ang),x+dx,y+dy); im.stroke();
    const i=((y|0)*W+(x|0))*4; tip=`rgb(${px[i]},${px[i+1]},${px[i+2]})`;
    return true;
  }
  function swipe(field,t,budget){
    const late=t>0.9; let laid=0,tries=0,anchor=null;
    while(laid<budget && tries<budget*5){
      tries++;
      const i=(Math.random()*field.length)|0; const d=field[i]-t;
      if(late){ if(d>0.02) continue; } else if(d<-0.07||d>0.005) continue;
      const x=(i%masks.mw)*2+Math.random()*2, y=(i/masks.mw|0)*2+Math.random()*2;
      if(markerStroke(x,y,late)){ laid++; if(!anchor||Math.random()<0.12) anchor={x,y}; }
    }
    im.globalAlpha=1;
    if(anchor){ cursor.tx=anchor.x; cursor.ty=anchor.y; }
    cursor.x+=(cursor.tx-cursor.x)*0.22; cursor.y+=(cursor.ty-cursor.y)*0.22;
  }
  function drawTool(kind){
    const s=S; ctx.save(); ctx.translate(cursor.x,cursor.y);
    if(kind==='marker'){
      ctx.rotate(-0.95);
      ctx.fillStyle=tip; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(9*s,-5*s); ctx.lineTo(9*s,5*s); ctx.closePath(); ctx.fill();   // chisel tip
      ctx.fillStyle='#EDEDEA'; ctx.fillRect(9*s,-6*s,14*s,12*s);                                                                       // collar
      ctx.fillStyle=tip; ctx.fillRect(23*s,-7*s,70*s,14*s);                                                                             // barrel in ink colour
      ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(23*s,-7*s,70*s,3*s);
      ctx.fillStyle='#2b2a27'; ctx.fillRect(93*s,-7*s,3*s,14*s);
    } else if(kind==='eraser'){
      ctx.rotate(-0.5);
      ctx.fillStyle='#E9A0A8'; ctx.beginPath(); ctx.roundRect(-14*s,-9*s,54*s,18*s,4*s); ctx.fill();
      ctx.fillStyle='#F6F1E7'; ctx.fillRect(22*s,-9*s,18*s,18*s);
      ctx.strokeStyle='#3a3835'; ctx.lineWidth=1.2*s; ctx.beginPath(); ctx.roundRect(-14*s,-9*s,54*s,18*s,4*s); ctx.stroke();
    } else if(kind==='sketch'){
      ctx.rotate(-0.75);
      ctx.fillStyle='#4a4844'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(9*s,-3*s); ctx.lineTo(9*s,3*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#EAD9B8'; ctx.beginPath(); ctx.moveTo(9*s,-3.5*s); ctx.lineTo(18*s,-4.5*s); ctx.lineTo(18*s,4.5*s); ctx.lineTo(9*s,3.5*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#C9A54A'; ctx.fillRect(18*s,-4.5*s,66*s,9*s);
      ctx.fillStyle='#D2342A'; ctx.fillRect(84*s,-4.5*s,8*s,9*s);
    } else {
      ctx.rotate(-0.75);
      ctx.fillStyle='#262522'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(7*s,-2*s); ctx.lineTo(7*s,2*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#D8D8D4'; ctx.fillRect(7*s,-3*s,10*s,6*s);
      ctx.fillStyle='#2b2a27'; ctx.fillRect(17*s,-4*s,72*s,8*s);
      ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(17*s,-4*s,72*s,2*s);
    }
    ctx.restore();
  }
  function compose(){
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    if(phaseIdx===0){ ctx.drawImage(layer,0,0); return; }
    ctx.drawImage(layers.sketch,0,0);            // rough sketch stays underneath
    if(phaseIdx===1){ ctx.drawImage(gag,0,0); drawCrumbs(); return; }
    if(phaseIdx===2){ ctx.drawImage(layer,0,0); return; }
    ctx.drawImage(layers.line,0,0);              // fineliner underneath…
    cc.clearRect(0,0,W,H); cc.drawImage(layers.base,0,0);
    cc.globalCompositeOperation='destination-in'; cc.drawImage(inkMask,0,0); cc.globalCompositeOperation='source-over';
    ctx.drawImage(colour,0,0);                   // …marker colour on top, opaque where it has been laid
  }

  function frame(now){
    if(myJob!==job) return;
    const elapsed=(now-start)/1000;
    setStitch(Math.min(1,elapsed/TOTAL));
    let ph=PHASES[phaseIdx]; let t=(now-phaseStart)/1000/ph.dur;
    if(t>=1){
      if(ph.key==='marker'){ im.globalAlpha=1; im.fillStyle='#fff'; im.fillRect(0,0,W,H); }   // every last sliver is inked
      phaseIdx++; phaseStart=now;
      if(phaseIdx>=PHASES.length){ ctx.drawImage(layers.base,0,0); finish(); return; }
      ph=PHASES[phaseIdx]; t=0;
    }
    if(ph.key==='gag' && !doodle){ phaseIdx++; phaseStart=now; ph=PHASES[phaseIdx]; t=0; }
    const e=t*t*(3-2*t)*0.85+t*0.15;
    if(ph.key==='sketch'||ph.key==='line'){
      const src=ph.key==='sketch'?layers.sketch:layers.line, fld=ph.key==='sketch'?masks.sketch:masks.line;
      maskTo(fld,e);
      lc.clearRect(0,0,W,H); lc.drawImage(src,0,0);
      lc.globalCompositeOperation='destination-in'; lc.drawImage(maskC,0,0,W,H); lc.globalCompositeOperation='source-over';
      compose(); frontier(fld,e); drawTool(ph.key);
    } else if(ph.key==='marker'){
      swipe(masks.colour,e,120); compose(); drawTool('marker');
    } else if(ph.key==='gag'){
      // 0–.55 draw the wrong thing · .55–.66 look at it · .66–1 rub it out
      if(t<0.55){ const q=t/0.55; drawDoodleTo(doodle.total*(q*q*(3-2*q))); compose(); drawTool('sketch'); }
      else if(t<0.66){ compose(); cursor.x+=(doodle.cx+doodle.size*0.7-cursor.x)*0.08; cursor.y+=(doodle.cy+doodle.size*0.6-cursor.y)*0.08; drawTool('sketch'); }
      else { erase((t-0.66)/0.34); compose(); drawTool('eraser'); }
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(t=>{start=t;phaseStart=t;frame(t);});
}

function finish(){ stageEl.textContent=''; actionsEl.hidden=false; knot.style.opacity=1; setStitch(1); }

function setStitch(p){ const x=Math.round(p*1000); stitch.setAttribute('d',`M0 7 L${x} 7`); knot.setAttribute('cx',x); }

document.getElementById('again').addEventListener('click',()=>{ if(current) choose(current); });
document.getElementById('save').addEventListener('click',()=>{
  const a=document.createElement('a'); a.download=`${current.replace(/\s+/g,'-').toLowerCase()}-drawn.png`; a.href=cv.toDataURL('image/png'); a.click();
});
addEventListener('resize',()=>{ if(current && actionsEl.hidden===false){ cancelAnimationFrame(raf); const url=cv.toDataURL(); setSize(); loadImage(url).then(i=>ctx.drawImage(i,0,0,W,H)); } });

/* open with art, not a blank sheet: auto-draw one suburb on load */
choose(DEMO);
</script>
