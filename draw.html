<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Sydney, drawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#262522;
    --graphite:#6E6C66;
    --rule:#DCD9D0;
    --thread:#D2342A;
    --hover:#F1EFE7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
  body{min-height:100vh}

  .page{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  @media (max-width:860px){.page{grid-template-columns:1fr}}

  /* index column */
  .index{border-right:1px solid var(--rule);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  @media (max-width:860px){.index{height:auto;position:static;border-right:0;border-bottom:1px solid var(--rule)}}
  .masthead{padding:28px 24px 18px}
  .masthead h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
  .masthead p{margin:0;color:var(--graphite);font-size:14px;max-width:22ch}
  .search{margin:0 24px 8px;position:relative}
  .search input{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search input::placeholder{color:var(--graphite)}
  .search input:focus-visible{border-bottom-width:2px}
  .list{overflow:auto;padding:6px 0 24px;flex:1;scrollbar-width:thin}
  @media (max-width:860px){.list{max-height:34vh}}
  .region{padding:14px 24px 4px;color:var(--graphite);font-size:12.5px;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:15px}
  .list button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:5px 24px;cursor:pointer;border-radius:0}
  .list button:hover{background:var(--hover)}
  .list button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .list button.on{background:var(--ink);color:var(--paper)}
  .list button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--thread);margin-left:8px;vertical-align:middle;opacity:0}
  .list button.has-art .dot{opacity:1}
  .empty{padding:18px 24px;color:var(--graphite)}

  /* studio */
  .studio{padding:36px 40px 48px;display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:860px){.studio{padding:20px 16px 32px}}
  .sheet{position:relative;width:100%;aspect-ratio:1939/811;background:var(--paper)}
  .sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .prompt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;transition:opacity .4s}
  .prompt.hide{opacity:0}
  .prompt span{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(22px,3.4vw,44px);color:var(--graphite);max-width:20ch;line-height:1.1}

  /* red thread progress */
  .thread{height:14px;width:100%}
  .thread svg{width:100%;height:14px;display:block;overflow:visible}
  .thread .stitch{stroke:var(--thread);stroke-width:2;fill:none;stroke-dasharray:11 7;stroke-linecap:round}
  .thread .knot{fill:var(--thread);opacity:0;transition:opacity .3s}

  .foot{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;justify-content:space-between;color:var(--graphite);font-size:14px;min-height:22px}
  .actions{display:flex;gap:18px}
  .foot button{border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule)}
  .foot button:hover{text-decoration-color:var(--ink)}
  .foot button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .foot button:disabled{cursor:default;color:var(--graphite)}
  .actions[hidden]{display:none}
  .note{color:var(--graphite);font-size:13px}

  @media (prefers-reduced-motion:reduce){.prompt{transition:none}}
</style>
</head>
<body>
<div class="page">
  <aside class="index">
    <div class="masthead">
      <h1>Greater Sydney,<br>drawn.</h1>
      <p>Pick a suburb and watch its portrait appear, line by line.</p>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Find a suburb" autocomplete="off" aria-label="Find a suburb"></div>
    <nav class="list" id="list" aria-label="Suburbs"></nav>
  </aside>

  <main class="studio">
    <div class="sheet" id="sheet">
      <canvas id="cv" aria-label="Suburb illustration"></canvas>
      <div class="prompt" id="prompt"><span>Choose a suburb from the index.</span></div>
    </div>
    <div class="thread" aria-hidden="true">
      <svg viewBox="0 0 1000 14" preserveAspectRatio="none">
        <path id="stitch" class="stitch" d="M0 7 L0 7"/>
        <circle id="knot" class="knot" cx="0" cy="7" r="3.5"/>
      </svg>
    </div>
    <div class="foot">
      <button id="sound" type="button" aria-label="Drawing sound" aria-pressed="false">Enable sound</button>
      <div class="actions" id="actions" hidden>
        <button id="again">Draw it again</button>
        <button id="save">Save as PNG</button>
      </div>
      <div class="note" id="note"></div>
    </div>
  </main>
</div>

/* ---------- index ---------- */
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
let current = null;

function renderList(filter=""){
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  let count = 0;
  for (const [region, subs] of Object.entries(REGIONS)){
    const hits = subs.filter(s => s.toLowerCase().includes(f));
    if (!hits.length) continue;
    const h = document.createElement('div'); h.className='region'; h.textContent=region; listEl.appendChild(h);
    for (const s of hits){
      const b = document.createElement('button');
      b.type='button'; b.textContent=s; b.dataset.suburb=s;
      if (ART[s]) b.classList.add('has-art');
      if (s===current){ b.classList.add('on'); b.setAttribute('aria-current','true'); }
      const d=document.createElement('span'); d.className='dot'; b.appendChild(d);
      b.addEventListener('click', ()=>choose(s));
      listEl.appendChild(b); count++;
    }
  }
  if (!count){ const e=document.createElement('div'); e.className='empty'; e.textContent=`No suburb called “${filter}”. Try another spelling.`; listEl.appendChild(e); }
}
qEl.addEventListener('input', e=>renderList(e.target.value));
renderList();

      for(let iy=Math.max(0,Math.floor(y-coverageRadius));iy<=Math.min(h-1,Math.ceil(y+coverageRadius));iy++)
        for(let ix=Math.max(0,Math.floor(x-coverageRadius));ix<=Math.min(w-1,Math.ceil(x+coverageRadius));ix++)
          if((ix-x)**2+(iy-y)**2<=coverageRadius**2)covered[iy*w+ix]=1;
    };

      const out=[],seed=indexAt(sx,sy);let x=sx,y=sy,dx=vx[seed]*sign,dy=vy[seed]*sign,lastCell=seed;
      for(let k=0;k<maxSteps;k++){
        const cell=indexAt(x,y);if(cell<0)break;
        let nx=vx[cell],ny=vy[cell];if(nx*dx+ny*dy<0){nx=-nx;ny=-ny;}
        if(nx*dx+ny*dy<0.5)break;
        nx=(nx+dx)*0.5;ny=(ny+dy)*0.5;const length=Math.hypot(nx,ny)||1;nx/=length;ny/=length;
        const tx=x+nx,ty=y+ny,next=indexAt(tx,ty);
        if(next<0||!allowed[next]||(k>2&&covered[next]&&occupied[next]&&next!==lastCell))break;

      }

    };
    for(let y=0;y<h;y++)for(let col=0;col<w;col++){
      const x=y%2?w-1-col:col,index=y*w+x;if(!occupied[index]||covered[index])continue;

      let points=back.reverse().concat([[x,y]],forward);
      if(points.length<2)points=[[x-vx[index]*0.35,y-vy[index]*0.35],[x+vx[index]*0.35,y+vy[index]*0.35]];
      for(let k=0;k<points.length;k++){
        mark(...points[k]);if(k)mark((points[k][0]+points[k-1][0])/2,(points[k][1]+points[k-1][1])/2);

    paths.forEach(draw);
    const coverage=mc.getImageData(0,0,W,H).data;
    for(const p of palette.pixels[pen.id]){
      if(coverage[p*4+3]===255)continue;
      const x=p%W+0.5,y=Math.floor(p/W)+0.5,index=indexAt(x/step-0.5,y/step-0.5);
      const dx=vx[index],dy=vy[index],reach=width*0.45;
      const stroke={points:[[x-dx*reach,y-dy*reach],[x+dx*reach,y+dy*reach]],colour:'#fff',ink:pen.ink,pen:pen.id,width};
      paths.push(stroke);draw(stroke);repairs++;

      // their corners and the antialias edge. Keep the seed as a certainty.
      const safe=Math.max(0.1,radius-1.25),span=reach+safe;
      for(let py=Math.max(0,Math.floor(y-span));py<=Math.min(H-1,Math.ceil(y+span));py++)
        for(let px=Math.max(0,Math.floor(x-span));px<=Math.min(W-1,Math.ceil(x+span));px++){
          const ox=px+0.5-x,oy=py+0.5-y,t=Math.max(-reach,Math.min(reach,ox*dx+oy*dy));
          if((ox-t*dx)**2+(oy-t*dy)**2<=safe*safe)coverage[(py*W+px)*4+3]=255;
        }
      coverage[p*4+3]=255;
    }
    strokes.push(...orderMarkerStrokes(paths));
  }
  return {...palette,source,field,strokes,repairs};
}

class MarkerPainter {
  constructor(pigments){
    this.pigments=pigments;this.pen=-1;
    this.mask=offscreen(W,H);this.context=this.mask.getContext('2d');
    this.layer=offscreen(W,H);this.layerContext=this.layer.getContext('2d');
    this.reveal=offscreen(W,H);this.revealContext=this.reveal.getContext('2d');
    this.completed=offscreen(W,H);this.completedContext=this.completed.getContext('2d');
  }
  renderActive(){
    const c=this.revealContext;c.clearRect(0,0,W,H);c.drawImage(this.layer,0,0);
    c.globalCompositeOperation='destination-in';c.drawImage(this.mask,0,0);c.globalCompositeOperation='source-over';
  }
  select(pen){
    if(pen===this.pen)return;
    if(this.pen>=0){this.renderActive();this.completedContext.drawImage(this.reveal,0,0);}
    this.context.clearRect(0,0,W,H);this.pen=pen;
    const image=this.layerContext.createImageData(W,H),out=image.data,source=this.pigments.source;
    for(const p of this.pigments.pixels[pen]){const i=p*4;out[i]=source[i];out[i+1]=source[i+1];out[i+2]=source[i+2];out[i+3]=255;}
    this.layerContext.putImageData(image,0,0);
  }
  drawTo(context){
    context.drawImage(this.completed,0,0);
    if(this.pen>=0){this.renderActive();context.drawImage(this.reveal,0,0);}
  }
}

function buildLayers(img,animate=true){
  const base=offscreen(W,H), b=base.getContext('2d');
  b.fillStyle='#FFFFFF'; b.fillRect(0,0,W,H);
  const scale=Math.min(W/img.width,H*0.82/img.height), iw=img.width*scale, ih=img.height*scale;
  const fit={ox:(W-iw)/2,oy:(H*0.82-ih)/2,iw,ih};
  b.drawImage(img,fit.ox,fit.oy,iw,ih);
  if(!animate)return {base,fit};
  const S=W/1000;
  const pencil=makeSketchStrokes(base).map((points,i)=>({points,colour:'#99958c',width:S*(1.0+0.18*Math.sin(i*1.7))}));
  const fineliner=makeSketchStrokes(base,true).map(points=>({points,colour:'#373530',width:0.95*S}));
  const pigments=makeMarkerLayers(base);
  return {base,fit,pencil:planStrokes(pencil),fineliner:planStrokes(fineliner),marker:planStrokes(pigments.strokes),pigments};
}

function makeLetteringPlan(name,width,height){
  const S=width/1000, capH=height*0.082, tracking=0.30, spacew=0.55;
  let adv=0;const items=[];
  for(const ch of name.toUpperCase()){
    if(ch===' '){adv+=spacew;continue;}
    const gl=GLYPHS[ch];if(!gl){adv+=0.55+tracking;continue;}
    items.push({gl,x0:adv});adv+=gl.w+tracking;
  }
  let em=capH,totalW=(adv-tracking)*em;const maxW=width*0.9;
  if(totalW>maxW){em*=maxW/totalW;totalW=(adv-tracking)*em;}
  const startX=(width-totalW)/2,topY=height*0.955-em,jit=0.6*S;
  const segments=[],strokes=[];let duration=0,previous=null,previousLetter=-1;
  items.forEach((it,li)=>{
    const bx=startX+it.x0*em,yj=Math.sin(li*1.7)*em*0.02;
    for(const pl of it.gl.s){
      const points=pl.map(([x,y],i)=>[
        bx+x*em+Math.sin((li*7+i)*12.9898)*jit,
        topY+y*em+yj+Math.sin((li*5+i)*7.13)*jit
      ]);
      const parts=[];let length=0;
      for(let i=1;i<points.length;i++){
        const L=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);
        if(L>0){parts.push({a:points[i-1],b:points[i],L});length+=L;}
      }
      if(!length)continue;
      if(previous){
        const pause=previousLetter===li?0.14:0.24;
        segments.push({a:previous,b:points[0],from:duration,dur:pause,lift:true});duration+=pause;
      }
      // Speed is measured in letter heights, so long suburb names retain the
      // same unhurried pace even when the lettering scales down to fit.
      const stroke={id:strokes.length,from:duration,dur:Math.max(0.26,length/em/2.4)};
      strokes.push(stroke);
      for(const part of parts){
        const dur=stroke.dur*part.L/length;
        segments.push({...part,from:duration,dur,lift:false,stroke});duration+=dur;
      }
      previous=points[points.length-1];previousLetter=li;
    }
  });
  return {segments,strokes,duration:Math.max(0.01,duration)};
}

function paintLettering(context,plan,progress,S){
  const time=Math.max(0,Math.min(1,progress))*plan.duration;
  const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
  context.save();context.strokeStyle='#141414';context.lineWidth=Math.max(1.8,2.6*S);
  context.lineCap='round';context.lineJoin='round';let tip=null;
  for(const segment of plan.segments){
    if(segment.from>time)break;
    const u=Math.max(0,Math.min(1,(time-segment.from)/segment.dur));
    const position=segment.lift?smooth(u):u;
    const x=segment.a[0]+(segment.b[0]-segment.a[0])*position;
    const y=segment.a[1]+(segment.b[1]-segment.a[1])*position;
    if(!segment.lift&&u>0){
      context.beginPath();context.moveTo(...segment.a);context.lineTo(x,y);context.stroke();
    }
    let strokeGain=0;
    if(!segment.lift){
      const elapsed=time-segment.stroke.from,remaining=segment.stroke.dur-elapsed;
      strokeGain=Math.min(smooth(elapsed/0.035),smooth(remaining/0.05));
    }
    tip={x,y,lift:segment.lift,strokeGain};
    if(time<segment.from+segment.dur)break;
  }
  context.restore();return progress<1?tip:null;
}

async function draw(name, src){
  const myJob=++job; cancelAnimationFrame(raf); resumeDrawing=null;
  drawingSound.silence(true);
  actionsEl.hidden=true; document.getElementById('save').hidden=false;
  document.getElementById('again').textContent='Draw it again';
  knot.style.opacity=0; setStitch(0);
  promptEl.classList.add('hide');
  setSize();
  const S=W/1000;
  let layers;
  try {
    if(lastPrepared&&lastPrepared.src===src&&lastPrepared.width===W&&lastPrepared.animate===!reduced){
      layers=lastPrepared.layers;
    }else{
      lastPrepared=null;
      const img=await loadImage(src);
      if(myJob!==job)return;
      await new Promise(resolve=>setTimeout(resolve,0));
      if(myJob!==job)return;
      layers=buildLayers(img,!reduced);
      lastPrepared={src,width:W,animate:!reduced,layers};
    }
  } catch(error) {
    if(myJob!==job)return;
    ctx.clearRect(0,0,W,H);
    promptEl.querySelector('span').textContent=`Couldn't load ${name}. Please try again.`;
    promptEl.classList.remove('hide');
    actionsEl.hidden=false; document.getElementById('save').hidden=true;
    document.getElementById('again').textContent='Try again';
    return;
  }
  cv.setAttribute('aria-label',`Illustration of ${name}`);
  const cursor={x:W*0.05,y:H*0.5,lift:false,ink:'#373530'};
  let tip='#373530';
  const lettering=makeLetteringPlan(name,W,H);
  const sign=progress=>paintLettering(ctx,lettering,progress,S);

  if(reduced){ctx.drawImage(layers.base,0,0);sign(1);finish();return;}
  /* the wrong doodle, on the margin next to the drawing */
  const g = GAG[name] || (ART[name]?null:GAG[DEMO]);
  const gag=offscreen(W,H); const gc=gag.getContext('2d'); gc.lineCap='round'; gc.lineJoin='round';
  let doodle=null;
  if(g&&DOODLES[g.wrong]){ const {ox,oy,iw,ih}=layers.fit; const size=(g.size||GAG_SIZE)*iw, pad=size/2+6; const cx=Math.min(W-pad,Math.max(pad,ox+g.x*iw)), cy=Math.min(H-pad,Math.max(pad,oy+g.y*ih));
    const wob=(i)=>Math.sin(i*12.9898)*0.012;
    const polys=DOODLES[g.wrong].map((pl,k)=>pl.map(([x,y],i)=>[cx-size/2+(x+wob(i+k*7))*size, cy-size/2+(y+wob(i*3+k))*size]));
    const segs=[]; let total=0; polys.forEach(pl=>{ for(let i=1;i<pl.length;i++){ const L=Math.hypot(pl[i][0]-pl[i-1][0],pl[i][1]-pl[i-1][1]); segs.push({a:pl[i-1],b:pl[i],L,from:total}); total+=L; } });
    doodle={segs,total,cx,cy,size};
  }
  let drawnTo=0; const crumbs=[];
  function drawDoodleTo(len){
    gc.strokeStyle='rgb(96,94,90)'; gc.lineWidth=Math.max(1.4,1.8*S); gc.globalAlpha=0.9;   // identical pen to the traced sketch beside it
    for(const s of doodle.segs){ if(s.from+s.L<=drawnTo||s.from>=len) continue;
      const t0=Math.max(0,(drawnTo-s.from)/s.L), t1=Math.min(1,(len-s.from)/s.L);
      gc.beginPath(); gc.moveTo(s.a[0]+(s.b[0]-s.a[0])*t0, s.a[1]+(s.b[1]-s.a[1])*t0); gc.lineTo(s.a[0]+(s.b[0]-s.a[0])*t1, s.a[1]+(s.b[1]-s.a[1])*t1); gc.stroke();
      cursor.x=s.a[0]+(s.b[0]-s.a[0])*t1; cursor.y=s.a[1]+(s.b[1]-s.a[1])*t1; cursor.lift=false; }
    drawnTo=len;
  }
  function erase(q){
    cursor.eraseProgress=q;
    const d=doodle; const sweeps=4; const k=q*sweeps; const row=Math.min(sweeps-1,Math.floor(k)); const u=k-row; const dir=row%2?1-u:u;
    const x=d.cx-d.size*0.6+dir*d.size*1.2, y=d.cy-d.size*0.5+(row+0.5)/sweeps*d.size;
    gc.globalCompositeOperation='destination-out'; gc.globalAlpha=1; gc.lineWidth=d.size/sweeps*1.15; gc.lineCap='round';
    gc.beginPath(); gc.moveTo(cursor.x,cursor.y); gc.lineTo(x,y); gc.stroke(); gc.globalCompositeOperation='source-over';
    cursor.x=x; cursor.y=y; cursor.lift=false;
    if(Math.random()<0.7) crumbs.push({x:x+(Math.random()-0.5)*d.size*0.4, y:y+(Math.random()-0.5)*d.size*0.15, vy:0.4*S+Math.random()*S, r:(0.8+Math.random()*1.4)*S, a:0.8});
  }
  function drawCrumbs(){ for(const c of crumbs){ c.y+=c.vy; c.vy+=0.12*S; c.a-=0.018; if(c.a<=0) continue; ctx.globalAlpha=c.a; ctx.fillStyle='#8a8580'; ctx.beginPath(); ctx.ellipse(c.x,c.y,c.r*1.6,c.r,0.6,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; while(crumbs.length&&crumbs[0].a<=0) crumbs.shift(); }

  const pencil=offscreen(W,H), pc=pencil.getContext('2d');
  const line=offscreen(W,H), lc=line.getContext('2d');
  const markerPainter=new MarkerPainter(layers.pigments),im=markerPainter.context;
  const selectMarker=segment=>markerPainter.select(segment.pen);
  const pencilState=strokeState(layers.pencil), lineState=strokeState(layers.fineliner), markerState=strokeState(layers.marker);
  const phases=PHASES.filter(phase=>phase.key!=='gag'||doodle)
    .map(phase=>phase.key==='sign'?{...phase,dur:lettering.duration}:
      phase.key==='marker'?{...phase,dur:Math.max(32,layers.marker.total/(W*4))}:phase);
  const total=phases.reduce((sum,phase)=>sum+phase.dur,0);
  let phaseIdx=0, phaseElapsed=0, elapsed=0, lastFrame=null;
  let lineProgress=0,markerProgress=0;
  const pace=t=>0.6*t+0.4*t*t*(3-2*t);
  function drawTool(kind){
    const s=S; ctx.save(); ctx.translate(cursor.x,cursor.y);
    if(cursor.lift){ ctx.globalAlpha=0.65; ctx.translate(0,-4*S); }
    if(kind==='marker'){
      ctx.rotate(-0.95);
      ctx.fillStyle=tip; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(9*s,-5*s); ctx.lineTo(9*s,5*s); ctx.closePath(); ctx.fill();   // chisel tip
      ctx.fillStyle='#EDEDEA'; ctx.fillRect(9*s,-6*s,14*s,12*s);                                                                       // collar
      ctx.fillStyle=tip; ctx.fillRect(23*s,-7*s,70*s,14*s);                                                                             // barrel in ink colour
      ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(23*s,-7*s,70*s,3*s);
      ctx.fillStyle='#2b2a27'; ctx.fillRect(93*s,-7*s,3*s,14*s);
    } else if(kind==='eraser'){
      ctx.rotate(-0.5);
      ctx.fillStyle='#E9A0A8'; ctx.beginPath(); ctx.roundRect(-14*s,-9*s,54*s,18*s,4*s); ctx.fill();
      ctx.fillStyle='#F6F1E7'; ctx.fillRect(22*s,-9*s,18*s,18*s);
      ctx.strokeStyle='#3a3835'; ctx.lineWidth=1.2*s; ctx.beginPath(); ctx.roundRect(-14*s,-9*s,54*s,18*s,4*s); ctx.stroke();
    } else if(kind==='sketch'){
      ctx.rotate(-0.75);
      ctx.fillStyle='#4a4844'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(9*s,-3*s); ctx.lineTo(9*s,3*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#EAD9B8'; ctx.beginPath(); ctx.moveTo(9*s,-3.5*s); ctx.lineTo(18*s,-4.5*s); ctx.lineTo(18*s,4.5*s); ctx.lineTo(9*s,3.5*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#C9A54A'; ctx.fillRect(18*s,-4.5*s,66*s,9*s);
      ctx.fillStyle='#D2342A'; ctx.fillRect(84*s,-4.5*s,8*s,9*s);
    } else {
      ctx.rotate(-0.75);
      ctx.fillStyle='#262522'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(7*s,-2*s); ctx.lineTo(7*s,2*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#D8D8D4'; ctx.fillRect(7*s,-3*s,10*s,6*s);
      ctx.fillStyle='#2b2a27'; ctx.fillRect(17*s,-4*s,72*s,8*s);
      ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(17*s,-4*s,72*s,2*s);
    }
    ctx.restore();
  }

  function compose(){
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    const key=phases[phaseIdx].key;
    ctx.save();
    ctx.globalAlpha=key==='line'?1-lineProgress*0.8:key==='marker'?0.2*(1-markerProgress):1;
    ctx.drawImage(pencil,0,0); ctx.restore();
    if(key==='gag'){ctx.drawImage(gag,0,0);drawCrumbs();return;}
    if(key==='line')ctx.drawImage(line,0,0);
    if(key==='marker'){
      ctx.save();ctx.globalAlpha=1-markerProgress;ctx.drawImage(line,0,0);ctx.restore();
      markerPainter.drawTo(ctx);
    }
  }
  function completePhase(key){
    if(key==='sketch')paintStrokes(pencilState,pc,1,cursor);
    if(key==='line'){paintStrokes(lineState,lc,1,cursor);lineProgress=1;}
    if(key==='marker'){paintStrokes(markerState,im,1,cursor,selectMarker);markerProgress=1;}
    if(key==='gag'){gc.clearRect(0,0,W,H);crumbs.length=0;}
  }
  function frame(now){
    if(myJob!==job||document.hidden)return;
    let soundKind=null;
    const delta=lastFrame===null?0:Math.max(0,(now-lastFrame)/1000);
    lastFrame=now; elapsed+=delta; phaseElapsed+=delta;
    // Carry elapsed time across phases and finish each route even after a
    // dropped frame. A 30 Hz display lays the same marks as a 120 Hz display.
    while(phaseIdx<phases.length && phaseElapsed>=phases[phaseIdx].dur){
      completePhase(phases[phaseIdx].key);
      phaseElapsed-=phases[phaseIdx].dur; phaseIdx++;
    }
    if(phaseIdx>=phases.length){
      ctx.drawImage(layers.base,0,0); sign(1); resumeDrawing=null; finish(); return;
    }
    const phase=phases[phaseIdx], t=Math.min(1,phaseElapsed/phase.dur);
    setStitch(Math.min(1,elapsed/total));
    if(phase.key==='sketch'){
      paintStrokes(pencilState,pc,pace(t),cursor); compose(); drawTool('sketch');
      soundKind='sketch';
    } else if(phase.key==='line'){
      lineProgress=pace(t);paintStrokes(lineState,lc,lineProgress,cursor);compose();drawTool('line');
      soundKind='line';
    } else if(phase.key==='marker'){
      markerProgress=t;paintStrokes(markerState,im,t,cursor,selectMarker);
      tip=cursor.ink;compose();drawTool('marker');soundKind='marker';
    } else if(phase.key==='gag'){
      cursor.lift=false;
      if(t<0.55){const q=t/0.55;drawDoodleTo(doodle.total*(q*q*(3-2*q)));compose();drawTool('sketch');soundKind='sketch';}
      else if(t<0.66){compose();cursor.lift=true;drawTool('sketch');}
      else{erase((t-0.66)/0.34);compose();drawTool('eraser');soundKind='eraser';}
    } else if(phase.key==='sign'){
      ctx.drawImage(layers.base,0,0);
      const pen=sign(t);
      if(pen){Object.assign(cursor,pen);drawTool('pen');soundKind='pen';}
    }
    drawingSound.contact(soundKind,cursor,delta);
    raf=requestAnimationFrame(frame);
  }
  resumeDrawing=()=>{if(myJob!==job)return;lastFrame=null;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);};
  if(!document.hidden)resumeDrawing();
}
function finish(){ drawingSound.silence(); actionsEl.hidden=false; knot.style.opacity=1; setStitch(1); }

function setStitch(p){ const x=Math.round(p*1000); stitch.setAttribute('d',`M0 7 L${x} 7`); knot.setAttribute('cx',x); }

document.getElementById('again').addEventListener('click',()=>{ if(current) choose(current); });
const soundButton=document.getElementById('sound');
soundButton.addEventListener('click',async()=>{
  if(drawingSound.enabled){
    drawingSound.disable();soundButton.textContent='Enable sound';soundButton.setAttribute('aria-pressed','false');return;
  }
  soundButton.disabled=true;
  const enabled=await drawingSound.enable();
  soundButton.disabled=false;
  soundButton.textContent=enabled?'Mute sound':'Enable sound';
  soundButton.setAttribute('aria-pressed',String(enabled));
  soundButton.title=enabled?'':'Sound could not start. Click to try again.';
  if(enabled&&current&&!reduced)choose(current);
});
document.getElementById('save').addEventListener('click',()=>{
  const a=document.createElement('a'); a.download=`${current.replace(/\s+/g,'-').toLowerCase()}-drawn.png`; a.href=cv.toDataURL('image/png'); a.click();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAnimationFrame(raf);drawingSound.silence(true);}
  else if(resumeDrawing)resumeDrawing();
});
addEventListener('pagehide',()=>drawingSound.silence(true));

/* open with art, not a blank sheet: auto-draw one suburb on load */
choose(DEMO);
</script>
</body>
</html>
